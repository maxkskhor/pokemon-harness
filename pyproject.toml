[project]
name = "pokemon-harness"
version = "0.1.0"
description = "Local Pokemon Red/Blue environment for learning LLM agent harnesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "pyboy>=2.7.1,<3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.30.0",
    # Runtime deps of the locally built mGBA Python bindings (Fire Red support).
    "cffi>=1.17.0",
    "cached-property>=2.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["env", "harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["env", "harness"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
